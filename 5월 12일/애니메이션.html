<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @keyframes TCA {
            0% {
                color: blue;
            }

            30% {
                color: yellow;
            }

            70% {
                color: red;
            }
            100%{color: blue;}
        }
        span{
            animation-name: TCA; 
            animation-duration: 6s;/*재생시간*/
            animation-iteration-count: infinite;/*반복횟수*/
        }
    </style>
</head>

<body>
<p style="font-size: 20px;"><span>여기</span>가 색이 변합니다.</p>
</body>

</html>
