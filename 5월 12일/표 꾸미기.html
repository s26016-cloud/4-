<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1105김세희</title>
    <style>
        table {
            border: 2px solid blue;
            /*바깥 테두리*/
            border-collapse: collapse
                /*테두리를 합침*/
            ;
        }

        td,
        th {
            border: 1px dotted green;
        }

        tbody tr:nth-child(odd) {
            background: forestgreen;
        }

        /*홀수*/
        tbody tr:nth-child(even) {
            background: cyan;
        }

        tr:hover {
            background: pink;
        }

        /*tbody tr로 하면 배경색이 있어도 변경가능*/

        /*짝수*/
        /*tbody 지우면 각각의 영역에서 짝수에 적용*/
    </style>
</head>

<body>
    <table><!--여기에 border를 주면 안에 테두리-->
        <thead>
            <tr>
                <th>이름</th><!--진한 글씨-->
                <th>HTML</th>
                <th>CSS</th>
            </tr>
        </thead>
        <tfoot>
            <tr>
                <th>합</th>
                <th>175</th>
                <th>169</th>
            </tr>
        </tfoot>
        <tbody>
            <tr>
                <td>이재문</td><!--일반 글씨-->
                <td>95</td>
                <td>99</td>
            </tr>
            <tr>
                <td>황기태</td>
                <td>80</td>
                <td>70</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
