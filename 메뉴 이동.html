<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>가로 메뉴 만들기</title>
    <style>
        /* 1. 메뉴 전체를 감싸는 ul 태그 스타일링 */
        .nav-menu {
            list-style: none;      /* 점(불릿) 제거 */
            padding: 0;
            margin: 0;
            background-color: #333; /* 배경색 (어두운 회색) */
            display: flex;         /* 가로 정렬을 위한 Flexbox 활성화 */
        }

        /* 2. 각 메뉴 항목(li) 스타일링 */
        .nav-menu li {
            /* 필요하다면 여기에 li 자체 스타일을 넣을 수 있습니다 */
        }

        /* 3. 실제 클릭하는 링크(a) 스타일링 */
        .nav-menu a {
            display: block;         /* 사각형 영역 전체를 클릭 가능하게 변경 */
            color: white;           /* 글자 색상 */
            text-align: center;
            padding: 14px 20px;     /* 위아래, 좌우 여백 */
            text-decoration: none;  /* 밑줄 제거 */
            font-size: 16px;
        }

        /* 4. 마우스를 올렸을 때(Hover) 효과 */
        .nav-menu a:hover {
            background-color: #111; /* 마우스 올리면 더 어두운 색으로 변경 */
            color: #4CAF50;         /* 글자 색상 변경 (포인트 라임색) */
        }
    </style>
</head>
<body>

    <nav>
        <ul class="nav-menu">
            <li><a href="index.html">홈</a></li>
            <li><a href="about.html">소개</a></li>
            <li><a href="services.html">서비스</a></li>
            <li><a href="contact.html">문의하기</a></li>
        </ul>
    </nav>

</body>
</html>
