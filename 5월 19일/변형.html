<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{display: inline-block; padding: 5px; color: white; background: olive;}
        #rotate{transform: rotate(30deg);}/*-30deg는 시계반대로 돔*/
        #skew{transform: skew(-30deg,40deg);}
        #translate{transform: translate(40px,80px);}
        #scale{transform: scale(2.0,2.5);}
    </style>
</head>
<body>
<br><br><br><br><br><br>
<div id="rotate">30도맘큼 회전</div>
<div id="skew">x축30px y축 45px</div>
<div id="translate">x축 40 y축 80 </div>
<div id="scale">가로 2배 세로 2.5배</div>
</body>
</html>
